<style>
/* ====== EDITA AQUÍ los textos (o en CONFIG, más abajo) ====== */
:root{
  --noche1:#1a0f2e; --noche2:#3b1748; --rosa:#ff6f91; --oro:#ffc75f; --crema:#fff4e6;
  --caja:#e63958; --caja2:#b8243f; --lazo:#ffd36e; --lazo2:#e0a93a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--noche1);color:var(--crema);
  font-family:Quicksand,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#fondo,#escena{position:fixed;inset:0;width:100%;height:100%;display:block}
#escena{opacity:0;transition:opacity 2.2s ease}
#escena.ver{opacity:1}
.capa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;text-align:center;transition:opacity 1.2s ease, transform 1.2s ease}
.oculta{opacity:0;pointer-events:none;transform:scale(.96)}
h1{font-family:"Dancing Script",cursive;font-weight:700;font-size:clamp(40px,11vw,84px);line-height:1;
  color:#fff;text-shadow:0 0 18px rgba(255,111,145,.75),0 0 40px rgba(255,111,145,.35)}
h1 span{display:inline-block;opacity:0;transform:translateY(30px) rotate(-8deg);animation:letra .9s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes letra{to{opacity:1;transform:none}}
.sub{margin-top:10px;font-size:clamp(16px,4.4vw,22px);letter-spacing:.04em;opacity:0;animation:aparece 1.4s ease 1.8s forwards}
@keyframes aparece{to{opacity:.95}}
#regalo{width:min(64vw,300px);margin:28px auto 10px;cursor:pointer;overflow:visible;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));opacity:0;animation:aparece 1s ease 2.4s forwards}
#regalo .flota{animation:flota 3s ease-in-out infinite;transform-origin:150px 260px}
@keyframes flota{50%{transform:translateY(-8px)}}
#regalo.tiembla .flota{animation:tiembla .55s ease}
@keyframes tiembla{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
#lazo,#cintas,#tapa,#brillo{transition:transform 1.1s cubic-bezier(.3,.8,.3,1.2),opacity 1s ease}
#lazo{transform-origin:150px 108px}
#regalo.paso2 #lazo{transform:translate(70px,-160px) rotate(220deg) scale(.4);opacity:0}
#regalo.paso3 #cintas{transform:scaleY(0);opacity:0;transform-origin:150px 300px}
#tapa{transform-origin:60px 130px}
#regalo.paso4 #tapa{transform:rotate(-14deg) translate(-6px,-26px)}
#regalo.paso4 #brillo{opacity:1}
#regalo.paso5 #tapa{transform:rotate(-70deg) translate(-60px,-260px);opacity:0}
#brillo{opacity:0}
.pista{min-height:1.6em;font-size:clamp(15px,4vw,19px);opacity:0;animation:aparece 1s ease 3s forwards}
.puntos{display:flex;gap:8px;justify-content:center;margin-top:10px;opacity:0;animation:aparece 1s ease 3s forwards}
.puntos i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .4s,transform .4s}
.puntos i.on{background:var(--rosa);transform:scale(1.3)}
/* Escena final */
#textos{justify-content:flex-start;padding-top:max(9vh,40px);pointer-events:none}
.frase{font-family:"Dancing Script",cursive;font-size:clamp(30px,8.6vw,62px);font-weight:700;line-height:1.1;color:#fff;
  text-shadow:0 2px 12px rgba(80,10,40,.65),0 0 30px rgba(255,150,120,.45);opacity:0;transform:translateY(24px);filter:blur(6px);
  transition:opacity 1.4s ease,transform 1.4s ease,filter 1.4s ease;margin:4px 0}
.frase.peq{font-family:Quicksand,sans-serif;font-weight:600;font-size:clamp(16px,4.4vw,24px);letter-spacing:.03em}
.frase.on{opacity:1;transform:none;filter:none}
.frase.fuera{opacity:0;transform:translateY(-20px);filter:blur(6px)}
#tarjeta{position:fixed;left:50%;bottom:max(5vh,22px);transform:translate(-50%,30px);width:min(92vw,460px);
  background:rgba(30,10,30,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);
  border-radius:20px;padding:16px 18px;text-align:center;opacity:0;transition:opacity 1.5s ease,transform 1.5s ease}
#tarjeta.on{opacity:1;transform:translate(-50%,0)}
#tarjeta b{display:block;font-family:"Dancing Script",cursive;font-size:clamp(24px,6.4vw,34px);color:var(--oro)}
#tarjeta p{font-size:clamp(14px,3.8vw,17px);line-height:1.45;margin-top:4px}
#tarjeta .firma{margin-top:8px;font-family:"Dancing Script",cursive;font-size:clamp(22px,5.6vw,28px);color:#ffd0dc}
#sonido{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:9;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);color:#fff;font-size:19px;cursor:pointer;display:none}
#otraVez{pointer-events:auto;margin-top:10px;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;
  padding:6px 16px;font:inherit;font-size:14px;cursor:pointer}
</style>

        <path d="M146 110 L124 150 L136 146 L140 158 L150 114Z" fill="var(--lazo2)"/>
        <path d="M154 110 L176 150 L164 146 L160 158 L150 114Z" fill="var(--lazo2)"/>

  </svg>
  <div class="pista" id="pista">Toca el regalo 🎁</div>

<script>
/* ===================== CONFIGURACIÓN (cambiar aquí) ===================== */
const CONFIG = {
  para: "Gorka",
  firma: "Aniceto",
  titulo: "24 años juntitos",
  subtitulo: "Chichiro Gorka ❤",
  // Elegir: "zumaia" (acantilados y ermita de San Telmo) o "zarautz" (playa larga y el ratón de Getaria)
  escena: "zumaia", fondo: 1,
  hotel: "Hotel Talasoterapia Zelai",
  lugar: "Zumaia · playa de Itzurun",
  detalle: "Habitación con vistas al mar, circuito de talaso y masaje para los dos.",
  // Frases que van saliendo cuando se abre el regalo
  frases: [
    ["24 años", ""],
    ["y te sigo eligiendo", ""],
    ["cada día", ""],
    ["En todo este tiempo", ""],
    ["hemos vivido momentos felices…", ""],
    ["…y momentos duros", ""],
    ["Pero tenemos lo más importante:", ""],
    ["a Nika ❤", ""],
    ["Vale la pena luchar", ""],
    ["y superar juntos cada obstáculo", ""],
    ["Lo que más quiero", ""],
    ["es que seamos felices juntos", ""],
    ["ver cómo pasa la vida a tu lado", ""],
    ["y cómo la construimos los dos", ""],
    ["Por eso…", ""],
    ["Este fin de semana…", ""],
    ["nos vamos tú y yo", ""],
    ["a relajarnos y conectar", ""],
  ],
  final: "Te quiero mucho"
};
/* ======================================================================= */

const $ = s => document.querySelector(s);
const mq = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Título letra a letra ---------- */
(() => {
  const h = $("#titulo");
  [...CONFIG.titulo].forEach((c, i) => {
    const s = document.createElement("span");
    s.textContent = c === " " ? " " : c;
    s.style.animationDelay = (0.25 + i * 0.07) + "s";
    h.appendChild(s);
  });
  $("#subtitulo").textContent = CONFIG.subtitulo;
})();

/* ---------- Fondo: corazones y estrellas ---------- */
const fondo = $("#fondo"), fx = fondo.getContext("2d");
let W, H, DPR;
function medir() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [fondo, $("#escena")]) { c.width = W * DPR; c.height = H * DPR; c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0); }
}
addEventListener("resize", medir); medir();

function corazon(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x - s * .9, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * .9, y - s * .35, x, y + s * .3);
  ctx.fill();
}
const estrellas = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, f: Math.random() * 6 }));
let flotantes = Array.from({ length: 22 }, () => nuevoCorazon(true));
function nuevoCorazon(alAzar) {
  return { x: Math.random() * W, y: alAzar ? Math.random() * H : H + 30, s: 6 + Math.random() * 16,
    v: .25 + Math.random() * .6, o: .15 + Math.random() * .45, w: Math.random() * 6, h: Math.random() < .5 ? "#ff6f91" : "#ffb3c6" };
}
let estallido = [];
function explotar(x, y) {
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 7;
    estallido.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, s: 5 + Math.random() * 12, vida: 1,
      c: ["#ff6f91", "#ffc75f", "#fff", "#ff9671", "#f9f871"][i % 5], corazon: Math.random() < .6 });
  }
}
function pintarFondo(t) {
  const g = fx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1a0f2e"); g.addColorStop(1, "#4a1942");
  fx.fillStyle = g; fx.fillRect(0, 0, W, H);
  for (const e of estrellas) {
    fx.globalAlpha = .35 + .35 * Math.sin(t / 700 + e.f);
    fx.fillStyle = "#fff"; fx.beginPath(); fx.arc(e.x * W, e.y * H * .8, e.r, 0, 7); fx.fill();
  }
  for (const c of flotantes) {
    c.y -= c.v; c.x += Math.sin(t / 900 + c.w) * .35;
    if (c.y < -30) Object.assign(c, nuevoCorazon(false));
    fx.globalAlpha = c.o; fx.fillStyle = c.h; corazon(fx, c.x, c.y, c.s);
  }
  pintarEstallido(fx);
  fx.globalAlpha = 1;
}
function pintarEstallido(ctx) {
  estallido = estallido.filter(p => p.vida > 0);
  for (const p of estallido) {
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .99; p.vida -= .009;
    ctx.globalAlpha = Math.max(p.vida, 0); ctx.fillStyle = p.c;
    if (p.corazon) corazon(ctx, p.x, p.y, p.s); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s / 4, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* ---------- Escena final: Zumaia. Cielo: buen tiempo → tormenta → arcoíris → anochecer con farolillos.
   Dibujo del paisaje: CONFIG.fondo (o ?fondo=N) 1 detallado · 2 acuarela · 3 plumilla · 4 geométrico · 5 papel recortado ---------- */
const esc = $("#escena"), ex = esc.getContext("2d");
let escenaActiva = false;
const R = (a, b) => a + Math.random() * (b - a);
const clamp = v => Math.max(0, Math.min(1, v));
const FONDO = Math.min(Math.max(+(new URLSearchParams(location.search).get("fondo")) || +CONFIG.fondo || 1, 1), 5);
const HOR = .6; // altura del horizonte

/* Colores */
function rgbDe(c) {
  if (c[0] === "#") { if (c.length === 4) c = "#" + [...c.slice(1)].map(x => x + x).join(""); return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
  return c.match(/[\d.]+/g).slice(0, 3).map(Number);
}
const mx = (a, b, k) => { const A = rgbDe(a), B = rgbDe(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`; };
const mxL = (a, b, k) => a.map((c, i) => mx(c, b[i], k));
const tri = (a, b, k) => { const A = a.split(",").map(Number), B = b.split(",").map(Number); return A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(","); };
const rgba = (c, a) => `rgba(${rgbDe(c).join(",")},${a})`;

/* Cielo y mar: día (4) y anochecer (5) */
const CD = {
  cielo: ["#3f62a0", "#7d9bd0", "#f0b9b0", "#ffd29e", "#fff1c8"], tormenta: ["#1d2130", "#2c3242", "#3b4252", "#4a5262", "#5d6474"],
  sol: "#ffe8a8", halo: "255,220,160", nubeA: "#8a93b8", nubeB: "#ffe0c4", nubeA2: "#1f2331", nubeB2: "#4b5162",
  mar: ["#f2c8a8", "#5b77a8", "#1c2a4c"], mar2: ["#4a5262", "#2e3546", "#151a26"], luz: "255,232,190",
  agua: "120,140,170", espuma: "245,245,250", pajaro: "rgba(30,34,48,.75)"
};
const CN = {
  cielo: ["#0b0f33", "#221f5c", "#4b3378", "#a5507a", "#f3875f"], cielo2: ["#070a24", "#18174a", "#33275e", "#6e3b6e", "#b8605a"],
  halo: "255,140,100", nubeA: "#2a2050", nubeB: "#d0707a", mar: ["#c0607a", "#3a2a60", "#0e0c26"], luz: "255,170,130",
  agua: "90,70,130", espuma: "230,200,230", silueta: "#0c0818"
};
/* Paisaje: colores de día y de anochecer (se dibuja dos veces y se funden) */
const LAY = {
  dia: { bruma: "#ffd9b0", lejos: ["#a49cb4", "#8b83a2"], papel: "#f1e6d6",
    rocaLuz: "#9a8a8c", rocaMed: "#76686f", rocaOsc: "#574b56", luz: "#ffd2a0", sombra: "#2a2030",
    hierba: "#6f8a4c", hierbaLuz: "#a3bb6a", hierbaOsc: "#47603a", ermita: "#f5ede2", ermitaSom: "#cdbfbd",
    tejado: "#b4563e", tejadoOsc: "#7d3a2e", hotel: "#f3eee8", hotelSom: "#c9c0c3", cristal: "#7b8fa8", vent: .1, ventana: "#ffcf86",
    arena: "#e6c6a0", arena2: "#c3a088", mojada: "#a4949a", espuma: "#ffffff", arbol: "#3f5638", arbolLuz: "#7e9a55", tinta: "#2b2330" },
  noche: { bruma: "#e07a6a", lejos: ["#5d4580", "#46346c"], papel: "#3d3158",
    rocaLuz: "#4f4068", rocaMed: "#3b2f57", rocaOsc: "#2a2145", luz: "#ff9c8a", sombra: "#0c0818",
    hierba: "#2c2a4a", hierbaLuz: "#45406a", hierbaOsc: "#1d1b36", ermita: "#c7b4d9", ermitaSom: "#8f7fae",
    tejado: "#5c3a5e", tejadoOsc: "#3a2442", hotel: "#c2aed2", hotelSom: "#8b7aa6", cristal: "#2c2a52", vent: 1, ventana: "#ffc27a",
    arena: "#6c527c", arena2: "#2c2044", mojada: "#4c3c6a", espuma: "#e8d0ec", arbol: "#1b1732", arbolLuz: "#2e2a4c", tinta: "#100b1e" }
};

/* Azar con semilla: el paisaje sale igual de día y de noche */
function semilla(n) { let a = n >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hacerRuido(r) { const v = Array.from({ length: 512 }, () => r() * 2 - 1); return x => { const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f), a = v[((i % 512) + 512) % 512], b = v[(((i + 1) % 512) + 512) % 512]; return a + (b - a) * s; }; }

/* Elementos que se mueven */
const gaviotas = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: R(.1, .3), v: R(.00018, .0004), f: i * 1.7, s: R(.7, 1.2) }));
const destellos = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() ** 1.6, f: Math.random() * 7 }));
const estrellasN = [
  ...Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random() ** 1.3, r: Math.random() ** 3 * 1.6 + .25, f: Math.random() * 7 })),
  ...Array.from({ length: 120 }, () => { const s = R(-1, 1), o = (Math.random() + Math.random() + Math.random() - 1.5) * .07;
    return { x: .55 + s * .5 + o * .5, y: .4 - s * .32 + o, r: Math.random() ** 3 * 1.1 + .2, f: Math.random() * 7 }; })
];
const nubes = Array.from({ length: 7 }, () => ({ x: Math.random(), y: R(.06, .4), w: R(.28, .6), v: R(.000004, .00001),
  bolas: Array.from({ length: 9 }, () => [R(-.5, .5), R(-.22, .08), R(.12, .28)]) }));
let globos = Array.from({ length: 14 }, () => ({ x: Math.random(), y: 1 + Math.random(), s: R(6, 15), v: R(.0006, .0013), w: Math.random() * 7 }));
const farolillos = Array.from({ length: 26 }, (_, i) => ({ x: R(.36, .5), y: .87, v: R(.0006, .0012), s: R(.7, 1.25), w: Math.random() * 7, d: R(-.00004, .00012), inicio: 64000 + i * 1000 }));
const gotas = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), v: R(.012, .02), l: R(10, 22) }));
let fugaz = null, proxFugaz = 72000;

/* ===== Geometría común del paisaje ===== */
const orillaY = x => H * .82 + (x / W) * H * .04;
function geo() {
  const r = semilla(7), rn = hacerRuido(r), hor = H * HOR, u = Math.min(W, H) / 400, x0 = W * .56, top = hor - H * .045;
  const cimaY = x => { const f = clamp((x - x0) / (W * .44)); return hor + H * .012 - H * .152 * Math.pow(Math.sin(f * Math.PI / 2), 1.15) + (rn(x / (9 * u)) * 1.2 + rn(x / (35 * u) + 50) * 2.5) * u * (.4 + f); };
  const cima = []; for (let x = x0; x <= W + 6; x += 3) cima.push([x, cimaY(x)]);
  const yT = cimaY(x0), cara = [];

  ex.save(); ex.beginPath(); ex.rect(0, 0, W, hor); ex.clip();
  const h = ex.createRadialGradient(x, y, r * .3, x, y, r * 6);
  h.addColorStop(0, `rgba(${P.halo},${.7 * alfa})`); h.addColorStop(.35, `rgba(${P.halo},${.22 * alfa})`); h.addColorStop(1, `rgba(${P.halo},0)`);
  ex.fillStyle = h; ex.fillRect(0, 0, W, hor);
  const d = ex.createRadialGradient(x, y - r * .2, 0, x, y, r); d.addColorStop(0, "#fffbe8"); d.addColorStop(1, P.sol);
  ex.globalAlpha = alfa; ex.fillStyle = d; ex.beginPath(); ex.arc(x, y, r, 0, 7); ex.fill();
  ex.restore(); ex.globalAlpha = 1;
}
function pintarNubes(t, arriba, abajo, alfa, escala = 1) {
  for (const n of nubes) {
    const cx = ((n.x + t * n.v) % 1.5 - .25) * W, cy = n.y * H, wp = n.w * W * escala;
    ex.save(); ex.translate(cx, cy); ex.scale(1, .4);
    const g = ex.createLinearGradient(0, -wp * .4, 0, wp * .15); g.addColorStop(0, arriba); g.addColorStop(1, abajo);
    ex.globalAlpha = alfa; ex.fillStyle = g; ex.beginPath();
    for (const [bx, by, br] of n.bolas) { const r = br * wp; ex.moveTo(bx * wp + r, by * wp); ex.arc(bx * wp, by * wp, r, 0, 7); }
    ex.fill(); ex.restore();
  }

}
function pintarEstrellas(t, a) {
  if (a <= 0) return;
  ex.fillStyle = "#fff";
  for (const e of estrellasN) {
    if (e.y < 0 || e.y > 1 || e.x < 0 || e.x > 1) continue;
    ex.globalAlpha = a * (.45 + .45 * Math.sin(t / (500 + e.f * 90) + e.f * 9));
    ex.beginPath(); ex.arc(e.x * W, e.y * H * HOR * .97, e.r, 0, 7); ex.fill();
  }
  ex.globalAlpha = 1;
}
function estrellaFugaz(t) {
  if (!fugaz && t > proxFugaz) { fugaz = { x: R(.35, .95) * W, y: R(.04, .25) * H, t0: t }; proxFugaz = t + R(4500, 9000); }
  if (!fugaz) return;
  const k = (t - fugaz.t0) / 900; if (k > 1) { fugaz = null; return; }
  const x = fugaz.x - k * W * .35, y = fugaz.y + k * H * .1;

  g.addColorStop(0, `rgba(255,255,255,${1 - k})`); g.addColorStop(1, "rgba(255,255,255,0)");
  ex.strokeStyle = g; ex.lineWidth = 2; ex.beginPath(); ex.moveTo(x, y); ex.lineTo(x + W * .12, y - H * .035); ex.stroke();
}
function mar(t, P, lx, lr, amp = 1) {
  const hor = H * HOR, g = ex.createLinearGradient(0, hor, 0, H);
  g.addColorStop(0, P.mar[0]); g.addColorStop(.3, P.mar[1]); g.addColorStop(1, P.mar[2]);
  ex.fillStyle = g; ex.fillRect(0, hor, W, H - hor);
  ex.fillStyle = `rgba(${P.luz},.35)`; ex.fillRect(0, hor, W, 1);
  for (let i = 0; i < 40; i++) {
    const f = i / 40, y = hor + 2 + f * f * H * .25, ancho = lr * (.5 + f * 2.2) * (.55 + .45 * Math.sin(t / 380 + i * 1.7));
    const off = Math.sin(t / 900 + i * 2.3) * lr * .25 * f;
    ex.fillStyle = `rgba(${P.luz},${.6 * (1 - f) * P.brillo})`; ex.fillRect(lx - ancho / 2 + off, y, ancho, 1.2 + f * 2.5);
  }
  for (const d of destellos) {
    const a = .5 + .5 * Math.sin(t / 260 + d.f * 3);
    ex.fillStyle = `rgba(${P.luz},${a * .35 * P.brillo})`; ex.fillRect(d.x * W, hor + d.y * H * .25, 1.5 + a * 3, 1);
  }
  ex.lineWidth = 1;
  for (let c = 0; c < 9; c++) {
    const f = (c + 1) / 10, base = hor + f * f * H * .24, A = (1.5 + f * 6) * amp;
    ex.strokeStyle = `rgba(${P.luz},${.08 + f * .08})`; ex.beginPath();
    for (let x = 0; x <= W; x += 10) { const y = base + Math.sin(x / (30 + f * 70) + t / (1400 - c * 80) + c) * A; x ? ex.lineTo(x, y) : ex.moveTo(x, y); }
    ex.stroke();
  }
}
function orilla(t, P) {
  const u = Math.min(W, H) / 400, k = (Math.sin(t / 2600) + 1) / 2, d = H * (.006 + k * .028), fin = W * .8;
  const borde = x => orillaY(x) + d + Math.sin(x / 23 + t / 700) * 2.5 * u;
  ex.fillStyle = `rgba(${P.agua},.55)`; ex.beginPath(); ex.moveTo(0, orillaY(0) - 3);
  for (let x = 0; x <= fin; x += 8) ex.lineTo(x, orillaY(x) - 3);
  for (let x = fin; x >= 0; x -= 8) ex.lineTo(x, borde(x));
  ex.fill();
  ex.strokeStyle = `rgba(${P.espuma},.75)`; ex.lineWidth = 2 * u; ex.beginPath();
  for (let x = 0; x <= fin; x += 8) x ? ex.lineTo(x, borde(x)) : ex.moveTo(x, borde(x));
  ex.stroke();
  const y2 = H * .8 + Math.sin(t / 2600 + 1.4) * H * .006;
  ex.strokeStyle = `rgba(${P.espuma},.45)`; ex.lineWidth = 1.5 * u; ex.beginPath();
  for (let x = 0; x <= W * .7; x += 8) { const y = y2 + (x / W) * H * .03 + Math.sin(x / 17 + t / 500) * 1.5 * u; x ? ex.lineTo(x, y) : ex.moveTo(x, y); }
  ex.stroke();
}
function pajaros(t, color) {
  ex.strokeStyle = color; ex.lineWidth = 1.6;
  for (const g of gaviotas) {
    g.x += g.v; if (g.x > 1.1) g.x = -.1;
    const x = g.x * W, y = g.y * H + Math.sin(t / 800 + g.f) * 6, a = Math.sin(t / 180 + g.f) * 4 * g.s, s = 9 * g.s;
    ex.beginPath(); ex.moveTo(x - s, y - a); ex.quadraticCurveTo(x - s * .45, y - 5 * g.s, x, y); ex.quadraticCurveTo(x + s * .45, y - 5 * g.s, x + s, y - a); ex.stroke();
  }
}
function pareja(x, y, u, col, a) { // los dos, sentados de espaldas mirando al mar
  if (a <= 0) return;
  ex.save(); ex.globalAlpha = a; ex.fillStyle = col; ex.strokeStyle = col; ex.lineCap = "round";
  for (const [dx, h, inc] of [[-5.6, 1, .32], [5.6, 1.07, -.26]]) {
    const cx = x + dx * u, hh = h * u;
    ex.beginPath(); ex.ellipse(cx, y - 1.5 * u, 7.5 * u, 2.6 * u, 0, 0, 7); ex.fill();
    ex.beginPath(); ex.moveTo(cx - 6.8 * u, y - 1 * u);
    ex.bezierCurveTo(cx - 7.6 * u, y - 9 * hh, cx - 6.6 * u, y - 15 * hh, cx - 4.2 * u, y - 17 * hh);
    ex.quadraticCurveTo(cx, y - 18.6 * hh, cx + 4.2 * u, y - 17 * hh);
    ex.bezierCurveTo(cx + 6.6 * u, y - 15 * hh, cx + 7.6 * u, y - 9 * hh, cx + 6.8 * u, y - 1 * u); ex.closePath(); ex.fill();
    ex.fillRect(cx - 1.4 * u + inc * 2 * u, y - 20 * hh, 2.8 * u, 3.5 * hh);
    ex.beginPath(); ex.arc(cx + inc * 7 * u, y - 22.8 * hh, 4.3 * u, 0, 7); ex.fill();
  }
  ex.lineWidth = 2.6 * u; ex.beginPath(); ex.moveTo(x + 2.5 * u, y - 15.5 * u); ex.quadraticCurveTo(x - 3 * u, y - 19.5 * u, x - 9.5 * u, y - 16 * u); ex.stroke();
  ex.restore();
}
function farol(x, y, s, a) {
  const gl = ex.createRadialGradient(x, y, 0, x, y, 28 * s);
  gl.addColorStop(0, `rgba(255,190,110,${.5 * a})`); gl.addColorStop(1, "rgba(255,140,80,0)");
  ex.fillStyle = gl; ex.fillRect(x - 28 * s, y - 28 * s, 56 * s, 56 * s);
  const c = ex.createLinearGradient(0, y - 7 * s, 0, y + 7 * s); c.addColorStop(0, `rgba(255,170,90,${a})`); c.addColorStop(1, `rgba(255,236,180,${a})`);
  ex.fillStyle = c; ex.beginPath(); ex.moveTo(x - 4.5 * s, y - 7 * s); ex.lineTo(x + 4.5 * s, y - 7 * s); ex.lineTo(x + 3.2 * s, y + 6 * s); ex.lineTo(x - 3.2 * s, y + 6 * s); ex.fill();
  ex.fillStyle = `rgba(255,255,230,${a})`; ex.beginPath(); ex.ellipse(x, y + 5.5 * s, 2 * s, 1.1 * s, 0, 0, 7); ex.fill();

function rayos(x, y, a, rgb, t) {
  if (a <= 0) return;
  ex.save(); ex.beginPath(); ex.rect(0, 0, W, H * HOR); ex.clip(); ex.globalCompositeOperation = "lighter";
  for (let i = 0; i < 9; i++) {
    const ang = Math.PI * .5 + (i - 4) * .17 + Math.sin(t / 4000 + i) * .02, L = H;
    ex.fillStyle = `rgba(${rgb},${a * .07})`; ex.beginPath(); ex.moveTo(x, y);
    ex.lineTo(x + Math.cos(ang - .035) * L, y + Math.sin(ang - .035) * L); ex.lineTo(x + Math.cos(ang + .035) * L, y + Math.sin(ang + .035) * L); ex.fill();
  }
  ex.restore();
}

  ex.save(); ex.beginPath(); ex.rect(0, 0, W, H * HOR); ex.clip();
  ["#ff5a5a", "#ff9e45", "#ffe25a", "#6bd47a", "#5aaeff", "#6a64e0", "#a86ad8"].forEach((c, i) => {

  for (const g of gotas) {
    g.y += g.v; if (g.y > 1) { g.y = -.05; g.x = Math.random(); }
    const x = g.x * W, y = g.y * H; ex.moveTo(x, y); ex.lineTo(x - g.l * .25, y + g.l);

}

  for (const t0 of [22500, 22850, 29000, 34500, 34800]) {

    if (d > 0 && d < 450) { ex.fillStyle = `rgba(230,235,255,${.2 * (1 - d / 450)})`; ex.fillRect(0, 0, W, H); }
  }
}

/* ===== La escena: cada momento va con su frase ===== */
function pintarEscena(t) {
  if (capaTam !== W + "x" + H) {
    capaDia = capa(g => ESTILOS[FONDO](g, LAY.dia, geo(), semilla(11)));
    capaNoche = capa(g => ESTILOS[FONDO](g, LAY.noche, geo(), semilla(11)));
    capaTam = W + "x" + H;
  }
  const hor = H * HOR, m = Math.min(W, H);
  const s = clamp((t - 16000) / 6000) * (1 - clamp((t - 38000) / 8000)); // tormenta: «momentos duros» → «superar juntos»
  const d = clamp((t - 50000) / 28000), d2 = clamp((t - 75000) / 20000);  // anochece
  cielo(mxL(mxL(mxL(CD.cielo, CN.cielo, d), CN.cielo2, d2), CD.tormenta, s));
  pintarEstrellas(t, clamp((t - 68000) / 12000) * .85); if (t > 72000) estrellaFugaz(t);
  const sx = W * .3, sy = hor - H * .16 + d * H * .175, sr = m * .075, halo = tri(CD.halo, CN.halo, d);
  sol(sx, sy, sr, { halo, sol: CD.sol }, 1 - s);
  rayos(sx, sy, (1 - s) * clamp((t - 38000) / 4000) * (1 - clamp((t - 56000) / 8000)), halo, t);
  arcoiris(clamp((t - 42000) / 5000) * (1 - clamp((t - 60000) / 8000)));
  pintarNubes(t, mx(mx(CD.nubeA, CN.nubeA, d), CD.nubeA2, s), mx(mx(CD.nubeB, CN.nubeB, d), CD.nubeB2, s), .45 + .47 * s, 1 + .3 * s);
  if (s > 0) { ex.fillStyle = `rgba(30,34,46,${.45 * s})`; ex.fillRect(0, 0, W, hor); }
  mar(t, { mar: mxL(mxL(CD.mar, CN.mar, d), CD.mar2, s), luz: tri(CD.luz, CN.luz, d), brillo: (1 - s) * (1 - .4 * d) }, sx, sr, 1 + s * 1.8);
  ex.drawImage(capaDia, 0, 0, W, H);
  if (d > 0) { ex.globalAlpha = d; ex.drawImage(capaNoche, 0, 0, W, H); ex.globalAlpha = 1; }
  orilla(t, { agua: tri(CD.agua, CN.agua, d), espuma: tri(CD.espuma, CN.espuma, d) });
  if (s > 0) { ex.fillStyle = `rgba(20,24,36,${.32 * s})`; ex.fillRect(0, 0, W, H); }
  pareja(W * .42, H * .93, m / 200, CN.silueta, clamp((t - 60000) / 5000));
  for (const f of farolillos) {
    if (t < f.inicio) continue;
    f.y -= f.v * (.4 + .6 * f.y); f.x += f.d;
    if (f.y < -.05) { f.y = .87; f.x = R(.36, .5); }
    const a = clamp((.87 - f.y) * 12) * (.6 + .4 * f.y);
    farol(f.x * W + Math.sin(t / 1300 + f.w) * 8, f.y * H, f.s * (.35 + .65 * f.y) * m / 400, a);
  }
  lluvia(s); relampago(t);
  if (s < .2 && d < .8) pajaros(t, CD.pajaro);
  if (FONDO === 2 || FONDO === 3 || FONDO === 5) {
    if (!papel) papel = texturaPapel();
    ex.save(); ex.globalCompositeOperation = "multiply"; ex.globalAlpha = FONDO === 5 ? .16 : .22; ex.fillStyle = papel; ex.fillRect(0, 0, W, H); ex.restore();
  }
  for (const b of globos) {
    b.y -= b.v; if (b.y < -.05) { b.y = 1.05; b.x = Math.random(); }
    ex.globalAlpha = .45; ex.fillStyle = "#ff8fab";
    corazon(ex, b.x * W + Math.sin(t / 1000 + b.w) * 14, b.y * H, b.s);
  }
  ex.globalAlpha = 1;

}


function mezcla(a, b, k) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`;
}

let inicio = performance.now(), inicioEscena = 0;
function bucle(now) {
  const t = now - inicio;
  if (escenaActiva) pintarEscena(now - inicioEscena); else pintarFondo(t);
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);

/* ---------- Música romántica (se genera aquí mismo, sin archivos) ---------- */
let audio = null, maestro, reverb, siguiente = 0, compas = 0, tocaMelodia = false, silencio = false;
const BPM = 66, NEGRA = 60 / BPM;
const nota = n => 440 * Math.pow(2, (n - 69) / 12);
// Fa - Rem - Sib - Do (I-vi-IV-V), suave
const ACORDES = [[53, 57, 60, 65], [50, 57, 62, 65], [46, 58, 62, 65], [48, 55, 64, 67]];
const MELODIA = [[77, 2], [76, 1], [74, 1], [72, 3], [69, 1], [70, 2], [74, 2], [72, 4], [77, 2], [79, 1], [77, 1], [76, 2], [72, 2], [74, 3], [72, 1], [69, 4]];
function crearAudio() {
  audio = new (window.AudioContext || window.webkitAudioContext)();
  maestro = audio.createGain(); maestro.gain.value = 0;
  maestro.gain.linearRampToValueAtTime(.55, audio.currentTime + 3);
  reverb = audio.createConvolver();
  const len = audio.sampleRate * 3.2, imp = audio.createBuffer(2, len, audio.sampleRate);
  for (let c = 0; c < 2; c++) { const d = imp.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  reverb.buffer = imp;
  const mojado = audio.createGain(); mojado.gain.value = .55;
  reverb.connect(mojado).connect(maestro);
  maestro.connect(audio.destination);
  siguiente = audio.currentTime + .1;
  setInterval(programar, 120);
}
function piano(frec, cuando, dur, vol) {
  for (const [tipo, mult, v] of [["triangle", 1, 1], ["sine", 2, .35], ["sine", 3, .12]]) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.value = frec * mult; o.detune.value = (Math.random() - .5) * 6;
    g.gain.setValueAtTime(0, cuando);
    g.gain.linearRampToValueAtTime(vol * v, cuando + .012);
    g.gain.exponentialRampToValueAtTime(vol * v * .35, cuando + .35);
    g.gain.exponentialRampToValueAtTime(.0001, cuando + dur);
    o.connect(g); g.connect(maestro); g.connect(reverb);
    o.start(cuando); o.stop(cuando + dur + .05);
  }
}
function colchon(notas, cuando, dur) {
  for (const n of notas) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = nota(n - 12);
    g.gain.setValueAtTime(0, cuando); g.gain.linearRampToValueAtTime(.035, cuando + 1.2); g.gain.linearRampToValueAtTime(0, cuando + dur);
    o.connect(g); g.connect(reverb); o.start(cuando); o.stop(cuando + dur + .1);
  }
}
let posMel = 0, tMel = 0;
function programar() {
  while (siguiente < audio.currentTime + .6) {
    const ac = ACORDES[compas % 4], dur = NEGRA * 4;
    colchon(ac, siguiente, dur + .5);
    piano(nota(ac[0] - 12), siguiente, 3.5, .16);
    const patron = [1, 2, 3, 2, 1, 2, 3, 2];
    patron.forEach((p, i) => piano(nota(ac[p]), siguiente + i * NEGRA / 2, 2.2, .07 + (i === 0 ? .03 : 0)));
    if (tocaMelodia) {
      let t = 0;
      while (t < 4) {
        const [n, d] = MELODIA[posMel % MELODIA.length];
        if (tMel === 0) piano(nota(n), siguiente + t * NEGRA, d * NEGRA + 1.2, .12);
        const resto = d - tMel, paso = Math.min(resto, 4 - t);
        t += paso; tMel += paso;
        if (tMel >= d) { tMel = 0; posMel++; }
      }
    }
    siguiente += dur; compas++;
  }
}
function campanitas() {
  if (!audio) return;
  const t = audio.currentTime;
  [84, 88, 91, 96, 100].forEach((n, i) => piano(nota(n), t + i * .08, 2.5, .08));
}
$("#sonido").onclick = e => {
  e.stopPropagation(); if (!audio) return;
  silencio = !silencio;
  maestro.gain.cancelScheduledValues(audio.currentTime);
  maestro.gain.linearRampToValueAtTime(silencio ? 0 : .55, audio.currentTime + .4);
  $("#sonido").textContent = silencio ? "🔇" : "🔊";
};

/* ---------- Abrir el regalo poco a poco ---------- */
const PISTAS = ["Mmm… ¿qué será? Otra vez 😊", "¡Fuera el lazo! Sigue…", "Ya casi…", "Una vez más… 💛", ""];
let paso = 0;
const regalo = $("#regalo"), puntos = [...document.querySelectorAll("#puntos i")];
regalo.addEventListener("click", abrir);
function abrir() {
  if (paso >= 5) return;
  if (!audio) { crearAudio(); $("#sonido").style.display = "block"; }
  if (audio.state === "suspended") audio.resume();
  paso++;
  puntos[paso - 1].classList.add("on");
  regalo.classList.remove("tiembla"); void regalo.offsetWidth; regalo.classList.add("tiembla");
  if (paso >= 2) regalo.classList.add("paso" + paso);
  campanitas();
  if (navigator.vibrate) navigator.vibrate(paso === 5 ? [60, 40, 120] : 25);
  $("#pista").textContent = PISTAS[paso - 1];
  const r = regalo.getBoundingClientRect();
  if (paso === 4) for (let i = 0; i < 20; i++) estallido.push({ x: r.left + r.width / 2, y: r.top + r.height * .35, vx: (Math.random() - .5) * 3, vy: -Math.random() * 3, s: 4, vida: .8, c: "#ffc75f", corazon: false });
  if (paso === 5) {
    explotar(r.left + r.width / 2, r.top + r.height * .35);
    setTimeout(() => {
      $("#portada").classList.add("oculta");
      escenaActiva = true; inicioEscena = performance.now();
      $("#escena").classList.add("ver");
      tocaMelodia = true;
      contarHistoria();
    }, 1300);
  }
}

/* ---------- Texto animado de la escena final ---------- */
const espera = ms => new Promise(r => setTimeout(r, ms));
async function contarHistoria() {
  const caja = $("#textos");
  caja.classList.remove("oculta"); caja.innerHTML = "";
  for (const [texto, clase] of CONFIG.frases) {
    const p = document.createElement("div");
    p.className = "frase " + clase; p.textContent = texto;
    caja.appendChild(p);
    await espera(60); p.classList.add("on");
    await espera(2000 + texto.length * 55);
    p.classList.add("fuera"); await espera(1300); p.remove();
  }
  // final
  const f = document.createElement("div");
  f.className = "frase"; f.innerHTML = `${CONFIG.final}, ${CONFIG.para} ❤`;
  caja.appendChild(f); await espera(60); f.classList.add("on");
  explotar(W / 2, H * .25); campanitas();
  await espera(1600);
  const tj = $("#tarjeta");
  tj.innerHTML = `<b>${CONFIG.hotel}</b><p>${CONFIG.lugar}</p><p>${CONFIG.detalle}</p>
    <div class="firma">Juntitos para siempre.<br>Juntos todo es mejor<br>· ${CONFIG.firma} ·</div>
    <button id="otraVez">↺ Ver otra vez</button>`;
  tj.classList.add("on");
  $("#otraVez").onclick = () => location.reload();
}
</script>
